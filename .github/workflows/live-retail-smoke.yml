name: Live Retail Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "deployment.json"
      - ".github/workflows/live-retail-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-retail:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published artifact
        uses: actions/checkout@v4

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.63.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"

      - name: Verify published Lenta flow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require("playwright-core");

          const url =
            "https://zebrarectifier.github.io/checkni-g5-preview/?comparison=observed&catalog=retail";

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ["--no-sandbox"]
            });

            // Force a real cross-retailer race: hold the first GLOBUS root
            // response, switch to Lenta, then release the stale GLOBUS reply.
            // The published runtime must keep the newer retailer ownership.
            const racePage = await browser.newPage({
              viewport: { width: 390, height: 844 }
            });
            let releaseGlobusRoot;
            let globusRootHeld = false;
            const globusRootGate = new Promise((resolve) => {
              releaseGlobusRoot = resolve;
            });
            await racePage.route(
              "**/rest/v1/retail_catalog_categories**",
              async (route) => {
                const requestUrl = new URL(route.request().url());
                if (
                  !globusRootHeld
                  && requestUrl.searchParams.get("retailer_id") === "eq.globus"
                  && requestUrl.searchParams.get("depth") === "eq.0"
                ) {
                  globusRootHeld = true;
                  await globusRootGate;
                }
                await route.continue();
              }
            );
            await racePage.goto(url, {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });
            await racePage.locator("#retail-store-card-lenta").waitFor({
              state: "visible",
              timeout: 15000
            });
            for (let attempt = 0; attempt < 40 && !globusRootHeld; attempt += 1) {
              await racePage.waitForTimeout(100);
            }
            assert(globusRootHeld, "Did not capture the initial GLOBUS root request");
            await racePage.locator("#retail-store-card-lenta").click();
            await racePage.waitForFunction(() => (
              document.querySelector("#retail-store-card-lenta")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 22
            ), null, { timeout: 15000 });
            releaseGlobusRoot();
            await racePage.waitForTimeout(1500);
            assert(
              await racePage.locator("#retail-store-card-lenta")
                .getAttribute("aria-pressed") === "true",
              "Late GLOBUS response stole retailer selection from Lenta"
            );
            assert(
              await racePage.locator(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).count() === 22,
              "Late GLOBUS response repainted Lenta categories"
            );
            await racePage.close();

            const page = await browser.newPage({
              viewport: { width: 390, height: 844 }
            });

            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));

            let ready = false;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              await page.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await page.waitForTimeout(1800);
              if (await page.locator("#retail-store-card-lenta").count()) {
                ready = true;
                break;
              }
              await page.waitForTimeout(3500);
            }

            assert(ready, "Published page never exposed the Lenta store selector");

            const globus = page.locator("#retail-store-card");
            assert(
              await globus.getAttribute("aria-pressed") === "true",
              "GLOBUS must be selected on initial retail load"
            );

            const globusRoot = page.getByRole("button", {
              name: /Молочные продукты, сыр, яйца/
            });
            await globusRoot.waitFor({ state: "visible", timeout: 15000 });
            await globusRoot.click();

            const globusChild = page.getByRole("button", {
              name: /Молоко и молочные продукты/
            });
            await globusChild.waitFor({ state: "visible", timeout: 15000 });
            await globusChild.click();

            // Follow the actual live taxonomy instead of hard-coding
            // a fixed depth. The path must terminate in real products within
            // a bounded number of user taps.
            let reachedGlobusProducts = false;
            for (let depth = 0; depth < 5; depth += 1) {
              await page.waitForFunction(() => (
                document.querySelectorAll("#product-grid .product-card").length > 0
                || document.querySelectorAll(
                  "#retail-category-grid .retail-category-button:not(.is-loading)"
                ).length > 0
              ), null, { timeout: 15000 });

              if (await page.locator("#product-grid .product-card").count()) {
                reachedGlobusProducts = true;
                break;
              }

              const nextCategory = page.locator(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).first();
              await nextCategory.click();
            }

            if (!reachedGlobusProducts) {
              await page.waitForFunction(() => (
                document.querySelectorAll("#product-grid .product-card").length > 0
              ), null, { timeout: 15000 });
              reachedGlobusProducts = true;
            }
            assert(
              reachedGlobusProducts,
              "Published GLOBUS taxonomy did not reach products within bounded depth"
            );
            const globusUiState = await page.evaluate(() => ({
              catalogEyebrow:
                document.querySelector("#catalog-eyebrow")?.textContent ?? "",
              catalogNote:
                document.querySelector("#catalog-note")?.textContent ?? "",
              categoryTitle:
                document.querySelector("#retail-category-title")?.textContent ?? "",
              breadcrumbs:
                document.querySelector("#retail-breadcrumbs")?.textContent ?? "",
              globusPressed:
                document.querySelector("#retail-store-card")
                  ?.getAttribute("aria-pressed") ?? "",
              lentaPressed:
                document.querySelector("#retail-store-card-lenta")
                  ?.getAttribute("aria-pressed") ?? "",
              firstProductId:
                document.querySelector("#product-grid .product-card")
                  ?.getAttribute("data-product-id") ?? "",
              productCount:
                document.querySelectorAll("#product-grid .product-card").length
            }));
            console.log(
              "GLOBUS_UI_STATE",
              JSON.stringify(globusUiState)
            );

            try {
              await page.waitForFunction(() => (
                document.querySelector("#catalog-eyebrow")
                  ?.textContent?.includes("Глобус")
              ), null, { timeout: 5000 });
            } catch {
              const settledGlobusUiState = await page.evaluate(() => ({
                catalogEyebrow:
                  document.querySelector("#catalog-eyebrow")?.textContent ?? "",
                catalogNote:
                  document.querySelector("#catalog-note")?.textContent ?? "",
                categoryTitle:
                  document.querySelector("#retail-category-title")?.textContent ?? "",
                breadcrumbs:
                  document.querySelector("#retail-breadcrumbs")?.textContent ?? "",
                globusPressed:
                  document.querySelector("#retail-store-card")
                    ?.getAttribute("aria-pressed") ?? "",
                lentaPressed:
                  document.querySelector("#retail-store-card-lenta")
                    ?.getAttribute("aria-pressed") ?? "",
                firstProductId:
                  document.querySelector("#product-grid .product-card")
                    ?.getAttribute("data-product-id") ?? "",
                productCount:
                  document.querySelectorAll("#product-grid .product-card").length
              }));
              throw new Error(
                "Published GLOBUS leaf lost retailer identity: "
                + JSON.stringify(settledGlobusUiState)
              );
            }
            const globusProductCount = await page.locator(
              "#product-grid .product-card"
            ).count();
            assert(globusProductCount > 0, "Published GLOBUS leaf has no products");

            await page.goBack({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelectorAll("#product-grid .product-card").length === 0
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length > 0
            ), null, { timeout: 15000 });
            assert(
              await globus.getAttribute("aria-pressed") === "true",
              "Back from GLOBUS leaf lost retailer selection"
            );

            await page.goForward({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelectorAll("#product-grid .product-card").length > 0
            ), null, { timeout: 15000 });
            assert(
              await globus.getAttribute("aria-pressed") === "true",
              "Forward did not restore GLOBUS retailer state"
            );

            await page.reload({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll("#product-grid .product-card").length > 0
            ), null, { timeout: 15000 });

            const lenta = page.locator("#retail-store-card-lenta");
            await lenta.click();
            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card-lenta")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 22
            ), null, { timeout: 15000 });

            await page.goBack({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll("#product-grid .product-card").length > 0
            ), null, { timeout: 15000 });
            assert(
              await page.locator(
                '[data-product-id^="retail:lenta:"]'
              ).count() === 0,
              "Browser Back from Lenta left stale Lenta products in GLOBUS"
            );

            await page.goForward({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card-lenta")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 22
            ), null, { timeout: 15000 });

            await page.reload({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card-lenta")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 22
            ), null, { timeout: 15000 });
            assert(
              (await lenta.innerText()).includes("Лента · публичный каталог"),
              "Lenta selector has the wrong store label"
            );
            assert(
              (await lenta.innerText()).includes("наличие неизвестно"),
              "Lenta selector must not claim stock availability"
            );
            assert(
              (await lenta.innerText()).includes("22 категории · 19 товаров"),
              "Lenta selector must show 22 categories and 19 observed products"
            );
            assert(
              await lenta.getAttribute("aria-pressed") === "true",
              "Reload must preserve Lenta as the selected retailer"
            );
            assert(
              await page.locator("#retail-store-card").getAttribute("aria-pressed") === "false",
              "GLOBUS must become unselected after choosing Lenta"
            );

            const categoryButtons = page.locator(
              "#retail-category-grid .retail-category-button:not(.is-loading)"
            );
            await page.waitForFunction(() => (
              document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 22
            ), null, { timeout: 15000 });
            assert(
              await categoryButtons.count() === 22,
              "Published Lenta root must expose exactly 22 categories"
            );

            for (const expectedRoot of [
              "Молочные продукты, яйцо",
              "Мясо и птица",
              "Овощи, фрукты",
              "Хлеб и выпечка",
              "Напитки",
              "Бытовая химия"
            ]) {
              assert(
                (await categoryButtons.allTextContents())
                  .some((text) => text.includes(expectedRoot)),
                `Published Lenta root is missing category: ${expectedRoot}`
              );
            }

            const dairy = page.getByRole("button", {
              name: /Молочные продукты, яйцо/
            });
            await dairy.click();
            await page.waitForFunction(() => (
              document.querySelectorAll("#product-grid .product-card").length === 16
            ), null, { timeout: 15000 });
            assert(
              await page.locator("#product-grid .product-card").count() === 16,
              "Published Lenta dairy category must expose 16 products"
            );

            const eggCard = page.locator(
              '[data-product-id="retail:lenta:lenta-public-web:127515"]'
            );
            await eggCard.waitFor({ state: "visible", timeout: 15000 });
            const eggText = await eggCard.innerText();
            assert(
              eggText.includes("Яйцо куриное ОКСКОЕ СО, 10шт"),
              "Published dairy category is missing the Okskoe egg product"
            );
            assert(
              eggText.includes("149,99 ₽"),
              "Published Okskoe egg card has the wrong observed price"
            );
            assert(
              (await eggCard.locator("img.product-photo").getAttribute("src"))
                ?.includes("cdn.api.lenta.com"),
              "Published Okskoe egg card is missing the official Lenta image"
            );

            await page.locator("#retail-category-back").click();
            await page.waitForFunction(() => (
              document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 22
            ), null, { timeout: 15000 });

            const root = page.getByRole("button", {
              name: /Макароны, крупы, мука/
            });
            await root.waitFor({ state: "visible", timeout: 15000 });
            await root.click();

            await page.waitForFunction(() => (
              document.querySelectorAll(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).length === 8
            ), null, { timeout: 15000 });
            assert(
              await page.locator(
                "#retail-category-grid .retail-category-button:not(.is-loading)"
              ).count() === 8,
              "Published grocery root must expose exactly 8 Lenta subcategories"
            );

            const subcategory = page.getByRole("button", {
              name: /Каши, хлопья, мюсли/
            });
            await subcategory.waitFor({ state: "visible", timeout: 15000 });
            await subcategory.click();

            const card = page.locator(
              '[data-product-id="retail:lenta:lenta-public-web:709949"]'
            );
            await card.waitFor({ state: "visible", timeout: 15000 });

            const cardText = await card.innerText();
            for (const expected of [
              "Хлопья овсяные ЛЕНТА Экстра, 500г",
              "500 г",
              "44,99 ₽",
              "По Карте №1",
              "Лента · публичный каталог · источник"
            ]) {
              assert(
                cardText.includes(expected),
                `Published Lenta card is missing: ${expected}`
              );
            }

            const image = card.locator("img.product-photo");
            await image.waitFor({ state: "visible", timeout: 15000 });
            const imageState = await image.evaluate((node) => ({
              src: node.currentSrc || node.src,
              complete: node.complete,
              naturalWidth: node.naturalWidth
            }));
            assert(
              imageState.src.includes("cdn.api.lenta.com"),
              "Lenta card is not using the official image CDN"
            );
            assert(
              imageState.complete && imageState.naturalWidth > 0,
              "Official Lenta product image did not load"
            );

            const addButton = card.getByRole("button");
            assert(
              await addButton.isDisabled(),
              "Display-only Lenta observation must not enter the comparison basket"
            );

            assert(
              pageErrors.length === 0,
              `Published page errors: ${pageErrors.join(" | ")}`
            );

            await page.screenshot({
              path: "live-retail-smoke.png",
              fullPage: true
            });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retail-smoke
          path: live-retail-smoke.png
          if-no-files-found: ignore
          retention-days: 3
