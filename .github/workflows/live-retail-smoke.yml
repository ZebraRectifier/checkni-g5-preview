name: Live Retail Smoke

on:
  workflow_run:
    workflows: ["Publish verified Pages tree"]
    types: [completed]
  pull_request:
    paths:
      - "src/components/WebSnapshotResult.mjs"
      - ".github/workflows/live-retail-smoke.yml"
      - "tools/live-retail-smoke-contract.mjs"
      - "tests/live-retail-smoke-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKNI_PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  globus-address-contract:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKNI_PUBLISHED_SHA }}
      - name: Verify live smoke source and immutable-runtime contracts
        run: node --test tests/live-retail-smoke-contract.test.mjs
      - name: Verify archived basket references cannot recommend a winner
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { compareWebSnapshot } from './src/core/web-snapshot-comparison.mjs';
          import { buildWebSnapshotModel } from './src/components/WebSnapshotResult.mjs';
          const result = compareWebSnapshot([
            {id:'milk-25-900',quantity:1},
            {id:'kefir-1l',quantity:1},
            {id:'butter-825-180',quantity:1}
          ]);
          assert.equal(result.conclusion.kind,'cheapest');
          const model = buildWebSnapshotModel(result);
          assert.equal(model.referenceOnly,true);
          assert.equal(model.winner,null);
          assert.match(model.title,/Архивный ориентир/);
          assert.match(model.facts,/не текущая стоимость/);
          assert.ok(model.stores.every(store=>!store.isWinner && store.diffMinor===null));
          assert.ok(model.stores.filter(store=>store.summary.includes('Ориентир:')).length>=2);
          console.log('ARCHIVE_REFERENCE_OK',process.env.CHECKNI_PUBLISHED_SHA);
          NODE
      - name: Verify exact artifact address data
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {GLOBUS_MOSCOW_REGION_DIRECTORY as d} from './src/data/globusMoscowRegionStores.mjs';
          assert.equal(d.stores.length,16);
          assert.equal(new Set(d.stores.map(s=>s.officialStoreId)).size,16);
          for(const s of d.stores.filter(s=>s.priceStatus==='verified')) {
            assert.equal(s.bindingId,'store:'+s.officialStoreId);
            assert(s.priceObservations>0); assert(Number.isFinite(Date.parse(s.priceObservedAt)));
          }
          assert.equal(d.availability,'unknown'); assert.equal(d.assortment,'partial');
          NODE
  live-retail:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published artifact
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKNI_PUBLISHED_SHA }}

      - name: Wait for the reviewed address runtime on Pages
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {pinnedRuntimePrefix} from './tools/live-retail-smoke-contract.mjs';
          const prefix=pinnedRuntimePrefix(await readFile('index.html','utf8'));
          if(pinnedRuntimePrefix(await readFile('prices.html','utf8'),'priceCapture')!==prefix)
            throw Error('Entry pages disagree on the reviewed immutable runtime');
          const paths=['index.html','prices.html',prefix+'manifest.json',...[
            'src/app.mjs','src/priceCapture.mjs','src/components/HoriCommerce.mjs','src/components/NearbyShopping.mjs',
            'src/ports/nearbyShoppingPort.mjs','src/ports/addressRecovery.mjs','src/ports/retailCatalogPort.mjs'
          ].map(path=>prefix+path)];
          const expected=await Promise.all(paths.map(path=>readFile(path)));
          for(let attempt=0;attempt<12;attempt++){
            const matched=await Promise.all(paths.map(async(path,i)=>{
              try{const response=await fetch('https://zebrarectifier.github.io/checkni-g5-preview/'+path+'?verify='+process.env.CHECKNI_PUBLISHED_SHA,{signal:AbortSignal.timeout(8000)});
                return response.ok&&Buffer.from(await response.arrayBuffer()).equals(expected[i]);
              }catch{return false;}
            }));
            if(matched.every(Boolean)){console.log('PUBLISHED_ADDRESS_RUNTIME_MATCH',process.env.CHECKNI_PUBLISHED_SHA,prefix);process.exit(0);}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw Error('Pages does not yet serve the reviewed address runtime');
          NODE

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.63.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"

      - name: Verify published retail flow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require("playwright-core");
          const deployment = require("./deployment.json");

          const url =
            "https://zebrarectifier.github.io/checkni-g5-preview/?comparison=observed&catalog=retail";

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function storeFacts(card) {
            const name = await card.locator("strong").innerText();
            const scope = (await card.locator(".retail-store-copy > span").last().textContent()).trim();
            const tooltip = await card.getAttribute("title");
            const label = await card.getAttribute("aria-label");
            assert(name && tooltip === scope && label === name + ": " + scope,
              "Store card must expose its chain and complete source scope");
            return name + " · " + scope + "\n" + await card.locator(".retail-store-total").textContent();
          }

          async function allCategories(page) {
            await page.waitForFunction(() => document.querySelectorAll(
              "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
            ).length > 0, null, {timeout:15000});
            const all = page.locator("#retail-category-grid .pixel-all-categories");
            if (await all.isVisible()) await all.click();
          }
          async function liveLentaRoots(page) {
            const response = await page.waitForResponse(response => {
              const address = new URL(response.url());
              return address.origin === "https://cxpneczhczashanbetgj.supabase.co"
                && address.pathname === "/rest/v1/retail_catalog_categories"
                && address.searchParams.get("retailer_id") === "eq.lenta"
                && address.searchParams.get("store_id") === "eq.lenta-public-web"
                && address.searchParams.get("depth") === "eq.0"
                && response.request().method() === "GET";
            }, { timeout: 15000 });
            assert(response.ok(), "Live Lenta root request failed");
            const { expectedLentaRoots } = await import("./tools/live-retail-smoke-contract.mjs");
            return expectedLentaRoots(await response.json());
          }
          async function matchLentaRoots(page, roots) {
            await page.waitForFunction(expected => {
              const ids = [...document.querySelectorAll(
                "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
              )].map(node => node.dataset.categoryId).sort();
              return document.querySelector("#retail-store-card-lenta")
                ?.getAttribute("aria-pressed") === "true"
                && JSON.stringify(ids) === JSON.stringify(expected);
            }, roots.map(root => root.id).sort(), { timeout: 15000 });
          }
          async function chooseAddressCard(page, retailer, value) {
            const select = page.locator(`#${retailer}-store-address`);
            const label = await select.locator("option").evaluateAll((options, id) =>
              options.find(option => option.value === id)?.textContent, value);
            assert(label, `No address label for ${retailer}/${value}`);
            await page.locator(`#${retailer}-store-picker input[type=search]`).fill(
              label.replace(/^(?:Москва|МО) · /u, "").replace(/ — [^—]+$/u, "").replaceAll(" · ", " "));
            await page.locator(`#pixel-address-chooser [data-store-id="${value}"]`).click({noWaitAfter:true});
          }
          async function chooseStore(page, selector) {
            if (!await page.locator("#pixel-store-home").isVisible())
              await page.locator('[data-pixel-action="stores"]').click();
            await page.locator(selector).click();
            const exactRetailer = {
              "#retail-store-card": "globus",
              "#retail-store-card-magnit": "magnit",
              "#retail-store-card-metro": "metro"
            }[selector];
            if (exactRetailer) {
              const { settleExactStoreSelection } = await import("./tools/live-retail-smoke-contract.mjs");
              await settleExactStoreSelection(page, selector, exactRetailer, chooseAddressCard);
            }
            await page.locator("#pixel-storefront").waitFor({state:"visible"});
            await allCategories(page);
          }
          async function details(page, open) {
            const node = page.locator("#pixel-store-details");
            if (await node.evaluate(e => e.open) !== open) await node.locator(":scope > summary").click();
          }
          async function priceDetails(card) {
            const disclosure = card.locator("details").first();
            if (await disclosure.count() && !await disclosure.evaluate(e => e.open))
              await disclosure.locator(":scope > summary").click();
          }

          function validDateKey(value, label) {
            assert(typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/u.test(value),
              `Invalid ${label}`);
            const parsed = Date.parse(value + "T00:00:00.000Z");
            assert(Number.isFinite(parsed) && new Date(parsed).toISOString().slice(0, 10) === value,
              `Invalid ${label}`);
            return value;
          }

          function promoPeriod(definition, retailerId) {
            const from = validDateKey(definition?.validFrom, retailerId + ".validFrom");
            const through = validDateKey(definition?.validTo, retailerId + ".validTo");
            assert(from <= through, `Invalid ${retailerId} promo interval`);
            return { from, through };
          }

          function moscowDateKey(nowMs = Date.now()) {
            assert(Number.isFinite(nowMs), "Invalid Moscow date clock");
            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone: "Europe/Moscow", year: "numeric", month: "2-digit", day: "2-digit"
            }).formatToParts(new Date(nowMs));
            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            return validDateKey(`${values.year}-${values.month}-${values.day}`, "Moscow day");
          }

          function promoCurrent(period, today = moscowDateKey()) {
            return today >= period.from && today <= period.through;
          }

          function stage(name) {
            console.log("LIVE_RETAIL_STAGE", name, new Date().toISOString());
          }

          const promoPeriods = {
            auchan: promoPeriod(deployment.auchan, "auchan")
          };

          (async () => {
            const { readFileSync } = require("node:fs");
            const { pinnedRuntimePrefix } = await import("./tools/live-retail-smoke-contract.mjs");
            const runtimePrefix = pinnedRuntimePrefix(readFileSync("index.html", "utf8"));
            async function assertPublishedRuntime(page) {
              const entry = await page.locator('script[type="module"][src$="/src/app.mjs"]').getAttribute("src");
              assert(entry === "./" + runtimePrefix + "src/app.mjs",
                "Browser loaded a different runtime from the byte-verified artifact");
            }
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ["--no-sandbox"]
            });

            // Force a real cross-retailer race: hold the first GLOBUS root
            // response, switch to Lenta, then release the stale GLOBUS reply.
            // The published runtime must keep the newer retailer ownership.
            for (const width of [1280, 390]) {
              const nearby = await browser.newContext({
                viewport:{width,height:844},
                geolocation:{latitude:55.928776,longitude:38.003613,accuracy:10},
                permissions:["geolocation"]
              });
              const check = await nearby.newPage();
              check.setDefaultTimeout(15000);
              let geocoderCalls = 0, directorySuccesses = 0;
              // Observe from navigation onward: automatic location can cache the directory.
              check.on("response", response => {
                if (new URL(response.url()).pathname.endsWith("/data/nearbyGroceryStores.json")
                    && response.request().method() === "GET" && response.ok()) directorySuccesses++;
              });
              await check.addInitScript(() => {
                const original = navigator.geolocation.getCurrentPosition.bind(navigator.geolocation);
                window.__checkniGeoCalls = 0;
                navigator.geolocation.getCurrentPosition = (...args) => {
                  window.__checkniGeoCalls++;
                  return original(...args);
                };
              });
              await check.route("**/*", route => {
                const target = new URL(route.request().url());
                if (target.pathname.endsWith("/functions/v1/nearby-address")) geocoderCalls++;
                return ["zebrarectifier.github.io","cxpneczhczashanbetgj.supabase.co"].includes(target.hostname)
                  && !target.pathname.startsWith("/functions/v1/") ? route.continue() : route.abort();
              });
              try {
                await check.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
                await assertPublishedRuntime(check);
                await chooseStore(check,"#retail-store-card");
                await details(check,true);
                await check.locator("#nearby-shopping").getByRole("button",{name:"📍 Найти магазины рядом",exact:true}).click();
                const beforeGeo = await check.evaluate(() => window.__checkniGeoCalls);
                await check.locator("#nearby-locate").click();
                await check.waitForFunction(before => window.__checkniGeoCalls > before
                  && /Моё место · точность ≈10 м.*найдено:/u.test(
                    document.querySelector("#nearby-status")?.textContent || ""), beforeGeo, {timeout:15000});
                assert(directorySuccesses > 0,"Published nearby directory did not load successfully");
                await check.locator("#nearby-radius").selectOption("20");
                const connected = check.locator("#nearby-connected-only");
                if (await connected.isChecked()) await connected.uncheck();
                const counts = [5,10,15,20];
                const more = check.locator("#nearby-results").getByRole("button",{name:/Показать ещё/u});
                for (const count of counts) {
                  if (count !== 5) await more.press("Enter");
                  await check.waitForFunction(count => document.querySelectorAll("#nearby-results article").length === count,
                    count,{timeout:15000});
                }
                assert(geocoderCalls === 0,"Browser geolocation unexpectedly invoked the geocoder");
                console.log("LIVE_NEARBY_PAGINATION_OK",JSON.stringify({width,counts}));
                if(runtimePrefix.includes('fc89edf6375c11cf378dfdbdc4bc8962cbdf76b9ee18b291863095f013303d45')){
                  await check.goto(url,{waitUntil:"domcontentloaded"});
                  await assertPublishedRuntime(check);
                  await check.locator("#retail-store-card").click();
                  const chooser=check.locator("#pixel-address-chooser");
                  const rows=chooser.locator(".pixel-store-address-choice");
                  assert(await chooser.getByRole("searchbox").count()===1,"Globus chooser must show one search field");
                  assert(await rows.count()===5,"Globus chooser must start with five address rows");
                  assert(!/официальном справочнике|дат[ау] цен после выбора/iu.test(await chooser.innerText()),"Globus chooser exposes long source copy");
                  await chooseAddressCard(check,"globus","5011");
                  await chooser.waitFor({state:"hidden"});
                  await check.locator('#product-grid [data-product-id^="retail:globus:globus-store-5011:"]').first().waitFor({state:"visible",timeout:20000});
                  console.log("LIVE_GLOBUS_COMPACT_ADDRESS_OK",JSON.stringify({width,store:"5011"}));
                }

              } finally { await nearby.close(); }
            }
            const racePage = await browser.newPage({
              viewport: { width: 390, height: 844 }
            });
            racePage.setDefaultTimeout(15000);
            racePage.setDefaultNavigationTimeout(30000);
            stage("race:start");
            let releaseGlobusRoot;
            let globusRootHeld = false;
            const globusRootGate = new Promise((resolve) => {
              releaseGlobusRoot = resolve;
            });
            await racePage.route(
              "**/rest/v1/retail_catalog_categories**",
              async (route) => {
                const requestUrl = new URL(route.request().url());
                if (
                  !globusRootHeld
                  && requestUrl.searchParams.get("retailer_id") === "eq.globus"
                  && requestUrl.searchParams.get("depth") === "eq.0"
                ) {
                  globusRootHeld = true;
                  await globusRootGate;
                }
                await route.continue();
              }
            );
            let raceReady = false;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              await racePage.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await racePage.waitForTimeout(1200);
              if (await racePage.locator("#retail-store-card-lenta").count()) {
                raceReady = true;
                break;
              }
              await racePage.waitForTimeout(2500);
            }
            assert(
              raceReady,
              "Published page never exposed the Lenta selector for the race gate"
            );
            await assertPublishedRuntime(racePage);
            console.log("RACE_BEFORE_SELECT", await racePage.evaluate(() => ({
              homeHidden:document.querySelector("#pixel-store-home")?.hidden,
              selected:document.querySelector("#retail-store-card")?.getAttribute("aria-pressed"),
              bounds:document.querySelector("#retail-store-card")?.getBoundingClientRect().toJSON()
            })));
            await racePage.locator("#retail-store-card").click({noWaitAfter:true});
            const manualRaceAddress = racePage.getByRole("button",{name:"Выбрать магазин вручную"});
            if (await manualRaceAddress.isVisible()) await manualRaceAddress.click();
            const raceChooser = racePage.locator("#pixel-address-chooser");
            await raceChooser.waitFor({state:"visible"});
            const raceSelect = racePage.locator("#globus-store-address");
            const raceAddress = await raceSelect.locator("option").evaluateAll(options =>
              options.find(item => item.value && !item.disabled)?.value);
            assert(raceAddress, "No selectable GLOBUS address for the race gate");
            await chooseAddressCard(racePage, "globus", raceAddress);
            for (let attempt = 0; attempt < 40 && !globusRootHeld; attempt += 1) {
              await racePage.waitForTimeout(100);
            }
            assert(globusRootHeld, "Did not capture the initial GLOBUS root request");
            const raceRootResponse = liveLentaRoots(racePage);
            await chooseStore(racePage, "#retail-store-card-lenta");
            const raceRoots = await raceRootResponse;
            await matchLentaRoots(racePage, raceRoots);
            releaseGlobusRoot();
            await racePage.waitForTimeout(1500);
            assert(
              await racePage.locator("#retail-store-card-lenta")
                .getAttribute("aria-pressed") === "true",
              "Late GLOBUS response stole retailer selection from Lenta"
            );
            await matchLentaRoots(racePage, raceRoots);
            console.log("LENTA_RACE_ROOT_IDS", raceRoots.map(root => root.id).join(","));
            await racePage.close();
            stage("race:ok");

            const page = await browser.newPage({
              viewport: { width: 390, height: 844 }
            });
            page.setDefaultTimeout(15000);
            page.setDefaultNavigationTimeout(30000);
            stage("published-page:start");

            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));

            let ready = false;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              await page.goto(url, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await page.waitForTimeout(1800);
              if (await page.locator("#retail-store-card-lenta").count()) {
                ready = true;
                break;
              }
              await page.waitForTimeout(3500);
            }

            assert(ready, "Published page never exposed the Lenta store selector");
            await assertPublishedRuntime(page);

            // GitHub Pages can lag a branch push briefly. Do not validate the
            // previous artifact by accident: bounded-reload until the exact
            // Moscow Magnit release is visible.
            await chooseStore(page, "#retail-store-card-magnit");
            await details(page, true);
            let moscowMagnitPublished = false;
            for (let attempt = 0; attempt < 18; attempt += 1) {
              if (
                await page.locator('#magnit-store-address option[value="771878"]').count()
                && await page.locator("#retail-store-card-magnit").count()
              ) {
                moscowMagnitPublished = true;
                break;
              }
              await page.waitForTimeout(3000);
              await page.goto(
                url + "&release=33e8c5e5&attempt=" + attempt,
                { waitUntil: "domcontentloaded", timeout: 30000 }
              );
              await page.waitForTimeout(1200);
            }
            assert(
              moscowMagnitPublished,
              "GitHub Pages did not publish the Magnit address picker"
            );


            const globus = page.locator("#retail-store-card");
            stage("globus:start");
            await chooseStore(page, "#retail-store-card");
            await details(page, true);
            assert(await globus.getAttribute("aria-pressed") === "true", "GLOBUS must be explicitly selected");
            const picker = page.locator("#globus-store-address");
            await picker.waitFor({state:"visible",timeout:15000});
            assert(await picker.locator("option").count()===16,"All 16 official Moscow/MO addresses must be visible");
            for (const code of ["5011","5001","5023"]) {
              await details(page, true);
              await picker.selectOption(code);
              await details(page, false);
              await allCategories(page);
              await page.waitForFunction(code => (
                document.querySelector("#globus-store-address")?.value === code
                && document.querySelectorAll("#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)").length > 0
              ), code, {timeout:15000});
              await page.getByRole("button",{name:/Молочные продукты, сыр, яйца/}).click();
              const card = page.locator('#product-grid [data-product-id^="retail:globus:globus-store-'+code+':"]').first();
              await card.waitFor({state:"visible",timeout:15000});
              await priceDetails(card);
              const text = await card.innerText();
              assert(/\d[\d\s]*,\d{2} ₽/u.test(text),"GLOBUS exact-address card must expose a positive RUB observation");
              assert(text.includes("Обычная цена без карты"),"GLOBUS loyalty discount must not masquerade as the no-card price");
              assert(await card.locator(".add-button").isDisabled(),"GLOBUS observations remain display-only");
              assert(await page.locator('#product-grid [data-product-id^="retail:globus:"]:not([data-product-id^="retail:globus:globus-store-'+code+':"])').count()===0,"A previous address leaked into the new catalog");
              await page.reload({waitUntil:"domcontentloaded"});
              await page.waitForFunction(code => document.querySelector("#globus-store-address")?.value===code,code,{timeout:15000});
              await page.locator('#product-grid [data-product-id^="retail:globus:globus-store-'+code+':"]').first().waitFor({state:"visible",timeout:15000});
            }
            await page.screenshot({path:"globus-exact-address-smoke.png",fullPage:true});
            stage("globus:ok");

            const lenta = page.locator("#retail-store-card-lenta");
            stage("lenta:start");
            // Address/category checks above scroll the independent commerce
            // pane. Return to its store row before switching retailers.
            const lentaRootResponse = liveLentaRoots(page);
            await chooseStore(page, "#retail-store-card-lenta");
            const lentaRoots = await lentaRootResponse;
            await matchLentaRoots(page, lentaRoots);

            await page.goBack({ waitUntil: "domcontentloaded" });
            await page.locator("#pixel-store-home").waitFor({state:"visible"});
            await page.goBack({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll("#product-grid .product-card").length > 0
            ), null, { timeout: 15000 });
            assert(
              await page.locator(
                '[data-product-id^="retail:lenta:"]'
              ).count() === 0,
              "Browser Back from Lenta left stale Lenta products in GLOBUS"
            );

            await page.goForward({ waitUntil: "domcontentloaded" });
            await page.locator("#pixel-store-home").waitFor({state:"visible"});
            await page.goForward({ waitUntil: "domcontentloaded" });
            await allCategories(page);
            await matchLentaRoots(page, lentaRoots);

            await page.reload({ waitUntil: "domcontentloaded" });
            await allCategories(page);
            await matchLentaRoots(page, lentaRoots);
            assert(
              (await storeFacts(lenta)).includes("Лента · Онлайн-каталог"),
              "Lenta selector has the wrong store label"
            );
            assert(
              (await page.locator(".pixel-store-reference-scope").textContent())
                .includes("наличие неизвестно"),
              "Lenta storefront must preserve the complete stock/source scope"
            );
            assert(
              await lenta.getAttribute("aria-pressed") === "true",
              "Reload must preserve Lenta as the selected retailer"
            );
            assert(
              await page.locator("#retail-store-card").getAttribute("aria-pressed") === "false",
              "GLOBUS must become unselected after choosing Lenta"
            );

            const categoryButtons = page.locator(
              "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
            );
            await matchLentaRoots(page, lentaRoots);
            const lentaStoreText = await storeFacts(lenta);
            const lentaStoreCountMatch = lentaStoreText.match(
              /([\d\s]+) категори[яий] · ([\d\s]+) (?:товар|товара|товаров)/u
            );
            assert(
              lentaStoreCountMatch,
              "Lenta selector must expose a live product count"
            );
            const lentaStoreProductCount = Number(
              lentaStoreCountMatch[2].replace(/\s+/gu, "")
            );
            const lentaRootProductCount = (await categoryButtons.allTextContents())
              .reduce((sum, text) => {
                const match = text.match(/([\d\s]+) (?:товар|товара|товаров)/u);
                return sum + (
                  match ? Number(match[1].replace(/\s+/gu, "")) : 0
                );
              }, 0);
            assert(
              Number.isSafeInteger(lentaStoreProductCount)
                && lentaStoreProductCount > 0
                && lentaStoreProductCount === lentaRootProductCount
                && lentaRootProductCount === lentaRoots.reduce((sum, root) => sum + root.productCount, 0),
              "Lenta selector count must match the current root-category totals"
            );

            for (const expectedRoot of lentaRoots.map(root => root.name)) {
              assert(
                (await categoryButtons.allTextContents())
                  .some((text) => text.includes(expectedRoot)),
                `Published Lenta root is missing category: ${expectedRoot}`
              );
            }

            const dairy = page.getByRole("button", {
              name: /Молочные продукты, яйцо/
            });
            await dairy.click();

            let reachedLentaProducts = false;
            for (let depth = 0; depth < 6; depth += 1) {
              await page.waitForFunction(() => (
                document.querySelectorAll("#product-grid .product-card").length > 0
                || document.querySelectorAll(
                  "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
                ).length > 0
              ), null, { timeout: 15000 });

              if (await page.locator("#product-grid .product-card").count()) {
                reachedLentaProducts = true;
                break;
              }

              const candidates = page.locator(
                "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
              );
              const candidateTexts = await candidates.allTextContents();
              let nextIndex = candidateTexts.findIndex((text) => {
                const match = text.match(/([\d\s]+) (?:товар|товара|товаров)/u);
                return match && Number(match[1].replace(/\s+/gu, "")) > 0;
              });
              if (nextIndex < 0) nextIndex = 0;
              await candidates.nth(nextIndex).click();
            }

            if (!reachedLentaProducts) {
              await page.waitForFunction(() => (
                document.querySelectorAll("#product-grid .product-card").length > 0
              ), null, { timeout: 15000 });
              reachedLentaProducts = true;
            }
            assert(
              reachedLentaProducts,
              "Published Lenta taxonomy did not reach products within bounded depth"
            );
            const lentaUiState = await page.evaluate(() => ({
              catalogEyebrow:
                document.querySelector("#catalog-eyebrow")?.textContent ?? "",
              catalogNote:
                document.querySelector("#catalog-note")?.textContent ?? "",
              categoryTitle:
                document.querySelector("#retail-category-title")?.textContent ?? "",
              breadcrumbs:
                document.querySelector("#retail-breadcrumbs")?.textContent ?? "",
              globusPressed:
                document.querySelector("#retail-store-card")
                  ?.getAttribute("aria-pressed") ?? "",
              lentaPressed:
                document.querySelector("#retail-store-card-lenta")
                  ?.getAttribute("aria-pressed") ?? "",
              firstProductId:
                document.querySelector("#product-grid .product-card")
                  ?.getAttribute("data-product-id") ?? "",
              productCount:
                document.querySelectorAll("#product-grid .product-card").length
            }));
            console.log(
              "LENTA_UI_STATE",
              JSON.stringify(lentaUiState)
            );

            try {
              await page.waitForFunction(() => {
                const eyebrow =
                  document.querySelector("#catalog-eyebrow")?.textContent ?? "";
                const firstProductId =
                  document.querySelector("#product-grid .product-card")
                    ?.getAttribute("data-product-id") ?? "";
                const lentaPressed =
                  document.querySelector("#retail-store-card-lenta")
                    ?.getAttribute("aria-pressed");
                return (
                  eyebrow.includes("Лента")
                  && firstProductId.startsWith(
                    "retail:lenta:lenta-public-web:"
                  )
                  && lentaPressed === "true"
                );
              }, null, { timeout: 5000 });
            } catch {
              const settledLentaUiState = await page.evaluate(() => ({
                catalogEyebrow:
                  document.querySelector("#catalog-eyebrow")?.textContent ?? "",
                catalogNote:
                  document.querySelector("#catalog-note")?.textContent ?? "",
                categoryTitle:
                  document.querySelector("#retail-category-title")?.textContent ?? "",
                breadcrumbs:
                  document.querySelector("#retail-breadcrumbs")?.textContent ?? "",
                globusPressed:
                  document.querySelector("#retail-store-card")
                    ?.getAttribute("aria-pressed") ?? "",
                lentaPressed:
                  document.querySelector("#retail-store-card-lenta")
                    ?.getAttribute("aria-pressed") ?? "",
                firstProductId:
                  document.querySelector("#product-grid .product-card")
                    ?.getAttribute("data-product-id") ?? "",
                productCount:
                  document.querySelectorAll("#product-grid .product-card").length
              }));
              throw new Error(
                "Published Lenta leaf did not settle to Lenta ownership: "
                + JSON.stringify(settledLentaUiState)
              );
            }

            const card = page.locator("#product-grid .product-card").first();
            await card.waitFor({ state: "visible", timeout: 15000 });
            const productId = await card.getAttribute("data-product-id");
            assert(
              productId?.startsWith("retail:lenta:lenta-public-web:"),
              "Published Lenta leaf rendered a product from another retailer"
            );

            await priceDetails(card);
            const cardText = await card.innerText();
            assert(
              /\d[\d\s]*,\d{2} ₽/u.test(cardText),
              "Published Lenta card is missing an observed RUB price"
            );
            assert(
              cardText.includes("Лента · публичный каталог · источник"),
              "Published Lenta card lost store/source provenance"
            );

            const image = card.locator("img.product-photo");
            if (await image.count()) {
              await image.waitFor({ state: "visible", timeout: 15000 });
              const imageState = await image.evaluate((node) => ({
                src: node.currentSrc || node.src,
                complete: node.complete,
                naturalWidth: node.naturalWidth
              }));
              assert(
                imageState.src.includes("cdn.api.lenta.com"),
                "Lenta card is not using the official image CDN"
              );
              assert(
                imageState.complete && imageState.naturalWidth > 0,
                "Official Lenta product image did not load"
              );
            } else {
              assert(
                (await card.locator(".product-visual").innerText()).includes(
                  "Фото товара"
                ),
                "No-photo Lenta card is missing the calm fallback"
              );
            }

            const addButton = card.locator(".add-button");
            assert(
              await addButton.isDisabled(),
              "Display-only Lenta observation must not enter the comparison basket"
            );

            await page.goBack({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelectorAll("#product-grid .product-card").length === 0
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
              ).length > 0
            ), null, { timeout: 15000 });
            assert(
              await lenta.getAttribute("aria-pressed") === "true",
              "Back from Lenta leaf lost retailer selection"
            );

            await page.goForward({ waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => (
              document.querySelectorAll("#product-grid .product-card").length > 0
              && document.querySelector("#retail-store-card-lenta")
                ?.getAttribute("aria-pressed") === "true"
            ), null, { timeout: 15000 });
            assert(
              await page.locator(
                '[data-product-id^="retail:globus:"]'
              ).count() === 0,
              "Forward to Lenta leaf left stale GLOBUS products visible"
            );

            stage("lenta:ok");
            stage("magnit:start");
            const magnit = page.locator("#retail-store-card-magnit");
            await chooseStore(page, "#retail-store-card-magnit");
            await details(page, true);
            await page.locator("#magnit-store-address").selectOption("771878");
            await details(page, false);
            await allCategories(page);
            await page.waitForFunction(() => (
              document.querySelector("#magnit-store-address")?.value === "771878"
              && document.querySelector(".pixel-store-reference-scope")
                ?.textContent?.includes("Дмитровское")
            ), null, { timeout: 15000 });
            const magnitText = await page.locator(".pixel-store-reference-scope").textContent();
            assert(
              magnitText.includes("Дмитровское"),
              "Magnit storefront has the wrong selected address"
            );
            assert(
              magnitText.includes("наличие неизвестно"),
              "Magnit storefront must not claim stock availability"
            );
            assert(
              !magnitText.includes("Краснодар"),
              "Magnit selector leaked the retired Krasnodar scope"
            );

            await page.waitForFunction(() => (
              document.querySelector("#retail-store-card-magnit")
                ?.getAttribute("aria-pressed") === "true"
              && document.querySelectorAll(
                "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
              ).length === 18
            ), null, { timeout: 15000 });

            const magnitCategories = page.locator(
              "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
            );
            assert(
              await magnitCategories.count() === 18,
              "Published Magnit root must expose exactly 18 categories"
            );

            for (const expectedRoot of [
              "Молочный прилавок",
              "Овощи и фрукты",
              "Хлеб и выпечка",
              "Бакалея",
              "Заморозка",
              "Сладости",
              "Чай, кофе, какао",
              "Вода и напитки"
            ]) {
              assert(
                (await magnitCategories.allTextContents())
                  .some((text) => text.includes(expectedRoot)),
                `Published Magnit root is missing category: ${expectedRoot}`
              );
            }

            // Use a leaf with observations admitted for this exact address.
            await magnitCategories.filter({ hasText: /Рыба и морепродукты/u }).click();
            await page.waitForFunction(() => (
              document.querySelectorAll("#product-grid .product-card").length > 0
            ), null, { timeout: 15000 });

            const magnitCard = page.locator("#product-grid .product-card").first();
            await magnitCard.waitFor({ state: "visible", timeout: 15000 });
            const magnitProductId = await magnitCard.getAttribute("data-product-id");
            assert(
              magnitProductId?.startsWith("retail:magnit:magnit-771878:"),
              "Published Magnit leaf rendered a product from another retailer"
            );

            await priceDetails(magnitCard);
            const magnitCardText = await magnitCard.innerText();
            assert(
              /\d[\d\s]*,\d{2} ₽/u.test(magnitCardText),
              "Published Magnit card is missing an observed RUB price"
            );
            assert(
              magnitCardText.includes("Дмитровское") && magnitCardText.includes("источник"),
              "Published Magnit card lost store/source provenance"
            );

            const magnitImage = magnitCard.locator("img.product-photo");
            await magnitImage.waitFor({ state: "visible", timeout: 15000 });
            const magnitImageState = await magnitImage.evaluate((node) => ({
              src: node.currentSrc || node.src,
              complete: node.complete,
              naturalWidth: node.naturalWidth
            }));
            assert(
              magnitImageState.src.includes("images-foodtech.magnit.ru"),
              "Magnit card is not using the official image CDN"
            );
            assert(
              magnitImageState.complete && magnitImageState.naturalWidth > 0,
              "Official Magnit product image did not load"
            );
            assert(
              await magnitCard.locator(".add-button").isDisabled(),
              "Display-only Magnit observation must not enter the comparison basket"
            );

            stage("magnit:ok");

            const daDay = moscowDateKey();
            stage("da:start:" + daDay);
            // DA remains discoverable between issues. Current eligibility belongs
            // to each fetched row, not the date/count of an archived deployment.
            const da = page.locator("#retail-store-card-da");
            assert(await da.count() === 1, "DA network entry must remain discoverable");
            assert((await storeFacts(da)).includes("ДА! · Акции"),
              "DA entry lost its compact promotion label");
            await chooseStore(page, "#retail-store-card-da");
            assert(
              (await page.locator(".pixel-store-reference-scope").textContent())
                .includes("Публичный промо-каталог"),
              "DA storefront lost its complete public-network scope"
            );
            const daCategory = page.locator(
              "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
            ).first();
            const daResponse = page.waitForResponse(response => {
              const requestUrl = new URL(response.url());
              return requestUrl.origin === "https://cxpneczhczashanbetgj.supabase.co"
                && requestUrl.pathname === "/rest/v1/retail_catalog_items"
                && requestUrl.searchParams.get("retailer_id") === "eq.da"
                && requestUrl.searchParams.get("store_id") === "eq.da-public-promo"
                && response.request().method() === "GET";
            }, { timeout: 20000 });
            await daCategory.click();
            const response = await daResponse;
            assert(response.status() === 200, "DA catalogue read failed");
            const rawDaRows = await response.json();
            assert(Array.isArray(rawDaRows) && rawDaRows.length <= 160,
              "DA category response exceeded the existing bounded catalogue contract");
            const { normalizeRetailRow } = await import("./" + runtimePrefix + "src/ports/retailCatalogPort.mjs");
            const expectedDaRows = rawDaRows
              .map(row => normalizeRetailRow(row, "da", { nowMs: Date.now() }))
              .filter(Boolean);
            const daCards = page.locator('#product-grid [data-product-id^="retail:da:da-public-promo:"]');
            if (expectedDaRows.length === 0) {
              await page.locator("#empty-search").getByRole("heading", { name: "Действующих акций сейчас нет", exact: true })
                .waitFor({ state: "visible", timeout: 15000 });
              assert(await daCards.count() === 0,
                "Expired or unproven DA observations must not become current product cards");
              stage("da:no-current-rows:honest-empty");
            } else {
              await daCards.first().waitFor({ state: "visible", timeout: 15000 });
              const ids = await daCards.evaluateAll(nodes => nodes.map(n => n.dataset.productId));
              const expectedIds = new Set(expectedDaRows.map(row => row.id));
              assert(ids.length > 0 && ids.every(id => expectedIds.has(id)),
                "DA rendered a row outside the current-period normalizer result");
              const daCard = daCards.first();
              await priceDetails(daCard);
              const daCardText = await daCard.innerText();
              assert(/\d[\d\s]*,\d{2} ₽/u.test(daCardText), "DA card lost observed RUB price");
              assert(daCardText.includes("Промо-цена каталога"), "DA card lost promo condition");
              assert(/до \d{2}\.\d{2}/u.test(daCardText), "DA card lost its row-specific validity");
              assert(daCardText.includes("ДА! · публичный промо-каталог · источник"),
                "DA card lost source provenance");
              assert(await daCard.locator(".add-button").isDisabled(),
                "Display-only DA observation must not enter the comparison basket");
              const image = daCard.locator("img.product-photo");
              await image.waitFor({ state: "visible", timeout: 15000 });
              await image.evaluate(node => node.decode());
              assert(await image.evaluate(node => node.naturalWidth > 0
                && (node.currentSrc || node.src).startsWith("https://market-da.ru/assets/")),
              "DA current card lost its official product image");
              stage("da:current-row-truth:ok");
            }
            assert(moscowDateKey() === daDay,
              "Moscow date changed during DA smoke; preserve result and inspect next day");
            stage("da:ok");

            const auchanDay = moscowDateKey();
            stage("auchan:start:" + auchanDay);
            if (promoCurrent(promoPeriods.auchan, auchanDay)) {
              // Verify the dated Auchan Moscow public promo catalog on the
              // actually published Pages artifact.
              let auchanPublished = false;
              for (let attempt = 0; attempt < 16; attempt += 1) {
                const liveAuchanText = await storeFacts(page.locator(
                  "#retail-store-card-auchan"
                )).catch(() => "");
                if (
                  liveAuchanText.includes("АШАН · Акции")
                  && liveAuchanText.includes("1 категория · 312 товаров")
                ) {
                  auchanPublished = true;
                  break;
                }
                await page.waitForTimeout(2500);
                await page.goto(
                  url + "&auchan_release=0da8c263&attempt=" + attempt,
                  { waitUntil: "domcontentloaded", timeout: 30000 }
                );
                await page.waitForTimeout(900);
              }
              assert(
                auchanPublished,
                "Published Auchan selector does not expose the current 312-product Moscow promo"
              );

              const auchanStore = page.locator("#retail-store-card-auchan");
              await chooseStore(page, "#retail-store-card-auchan");
              assert(
                (await page.locator(".pixel-store-reference-scope").textContent())
                  .includes("промо 1–14 октября"),
                "Published Auchan storefront lost the dated Moscow promo scope"
              );
              await page.waitForFunction(() => (
                document.querySelector("#retail-store-card-auchan")
                  ?.getAttribute("aria-pressed") === "true"
                && document.querySelectorAll(
                  "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
                ).length === 1
              ), null, { timeout: 15000 });

              const auchanCategory = page.locator(
                '#retail-category-grid [data-category-id="950001"]'
              );
              await auchanCategory.waitFor({ state: "visible", timeout: 15000 });
              await auchanCategory.click();

              await page.waitForFunction(() => (
                document.querySelectorAll(
                  '#product-grid [data-product-id^="retail:auchan:auchan-msk-public-promo:"]'
                ).length > 0
              ), null, { timeout: 15000 });

              const auchanCard = page.locator(
                '#product-grid [data-product-id^="retail:auchan:auchan-msk-public-promo:"]'
              ).first();
              await auchanCard.waitFor({ state: "visible", timeout: 15000 });
              const auchanCardText = await auchanCard.innerText();
              assert(
                /\d[\d\s]*,\d{2} ₽/u.test(auchanCardText),
                "Published Auchan card is missing an observed RUB promo price"
              );
              assert(
                (
                  auchanCardText.includes("Промо-цена каталога")
                  || auchanCardText.includes("По карте АШАН")
                )
                && auchanCardText.includes("до 14.10"),
                "Published Auchan card lost promo/card validity truth"
              );
              assert(
                auchanCardText.includes(
                  "АШАН · Москва · публичный промо-каталог · источник"
                ),
                "Published Auchan card lost Moscow promo/source provenance"
              );
              assert(
                await auchanCard.locator(".add-button").isDisabled(),
                "Display-only Auchan promo observation must not enter the comparison basket"
              );
            } else {
              assert(await page.locator("#retail-store-card-auchan").count() === 0,
                "Non-current auchan promo selector must be absent on " + auchanDay);
              assert(await page.locator('.product-card[data-product-id^="retail:auchan:"]').count() === 0,
                "Non-current auchan promo cards must be absent on " + auchanDay);
              stage("auchan:not-current:absent");
            }
            assert(moscowDateKey() === auchanDay,
              "Moscow date changed during auchan promo smoke; rerun on the new day");
            stage("auchan:ok");

            assert(
              pageErrors.length === 0,
              `Published page errors: ${pageErrors.join(" | ")}`
            );

            await page.screenshot({
              path: "live-retail-smoke.png",
              fullPage: true
            });
            stage("all:ok");
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retail-smoke
          path: |
            live-retail-smoke.png
            globus-exact-address-smoke.png
          if-no-files-found: ignore
          retention-days: 3

