name: OKEY verified prices
on:
  push:
    branches: [main]
    paths:
      - 'tools/okey-public-catalog/collect-eda.mjs'
      - 'tools/okey-public-catalog/eda-parser.mjs'
      - 'tools/okey-public-catalog/verify-refresh.mjs'
      - 'tests/okeyRefreshVerification.test.mjs'
      - 'tools/okey-public-catalog/collect-official.mjs'
      - 'tools/okey-public-catalog/verify-official-refresh.mjs'
      - 'tools/okey-public-catalog/collect-published.mjs'
      - 'tools/okey-public-catalog/verify-published-refresh.mjs'
      - 'src/observations/okeyPublishedPromotions.mjs'
      - 'tests/okeyPublishedPromotions.test.mjs'
      - 'src/observations/okeyOfficialPromotions.mjs'
      - 'src/components/OkeyOfficialCatalog.mjs'
      - 'src/components/OkeyDeliveryCatalog.mjs'
      - 'tests/okeyOfficialPromotions.test.mjs'
      - '.github/workflows/okey-public-data.yml'
  pull_request:
    paths:
      - 'tools/okey-public-catalog/collect-official.mjs'
      - 'tools/okey-public-catalog/verify-official-refresh.mjs'
      - 'tools/okey-public-catalog/collect-published.mjs'
      - 'tools/okey-public-catalog/verify-published-refresh.mjs'
      - 'src/observations/okeyPublishedPromotions.mjs'
      - 'tests/okeyPublishedPromotions.test.mjs'
      - 'src/observations/okeyOfficialPromotions.mjs'
      - 'src/components/OkeyOfficialCatalog.mjs'
      - 'src/components/OkeyDeliveryCatalog.mjs'
      - 'tests/okeyOfficialPromotions.test.mjs'
      - 'tools/okey-public-catalog/verify-refresh.mjs'
      - 'tests/okeyRefreshVerification.test.mjs'
      - '.github/workflows/okey-public-data.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('okey-public-data-pr-{0}', github.event.pull_request.number) || 'okey-public-data' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify history and freshness safeguards without source requests
        run: node --test tests/dataPublication.test.mjs tests/addressPriceHistory.test.mjs tests/okeyRefreshVerification.test.mjs tests/okeyOfficialPromotions.test.mjs tests/okeyPublishedPromotions.test.mjs
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    # Collector is bounded to twelve minutes; leave time for validation and Pages.
    timeout-minutes: 25
    outputs:
      site_commit: ${{ steps.publication.outputs.site_commit }}
      base_commit: ${{ steps.publication.outputs.base_commit }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: true
      - name: Install locked collector dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Collect visible address-bound observations
        run: |
          node tools/okey-public-catalog/verify-refresh.mjs --start
          node tools/okey-public-catalog/collect-eda.mjs
          node tools/okey-public-catalog/collect-official.mjs
          node tools/okey-public-catalog/collect-published.mjs
      - name: Verify newly measured address-bound prices
        id: freshness
        continue-on-error: true
        run: node tools/okey-public-catalog/verify-refresh.mjs
      - name: Verify newly measured official city promotions
        id: official_freshness
        continue-on-error: true
        run: node tools/okey-public-catalog/verify-official-refresh.mjs
      - name: Verify newly measured published city promotions
        id: published_freshness
        continue-on-error: true
        run: node tools/okey-public-catalog/verify-published-refresh.mjs
      - name: Validate measured history
        run: node --test tests/addressPriceHistory.test.mjs
      - name: Commit changed observations only
        id: publication
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse HEAD)"
          git add src/data/okeyDeliveryHistory.json src/data/okeyDeliveryRefresh.json src/data/okeyOfficialPromotions.json src/data/okeyOfficialRefresh.json src/data/okeyPublishedPromotions.json src/data/okeyPublishedRefresh.json
          if ! git diff --cached --quiet; then
            git config user.name "CHECKNI Price History"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "DATA: publish OKEY collection result"
            PAGES_COMMIT="$(git rev-parse HEAD)" PAGES_BASE_COMMIT="$expected_base" PAGES_FEED=okey node tools/browser-release/publication-guard.mjs --data-delta
            read -r remote_base _ <<< "$(git ls-remote origin refs/heads/main)"
            test "$remote_base" = "$expected_base"
            git push origin HEAD:main
            echo "site_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "base_commit=$expected_base" >> "$GITHUB_OUTPUT"
          fi
      - name: Require fresh prices for a successful update
        if: always() && steps.freshness.outcome != 'success' && steps.official_freshness.outcome != 'success' && steps.published_freshness.outcome != 'success'
        run: |
          echo 'No verified fresh OKEY prices. Inspect the freshness summary; source protection remains enabled.'
          exit 1
  pages:
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.publish.outputs.site_commit != ''
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    env:
      PAGES_COMMIT: ${{ needs.publish.outputs.site_commit }}
      PAGES_BASE_COMMIT: ${{ needs.publish.outputs.base_commit }}
      PAGES_FEED: okey
    steps:
      - name: Reject non-SHA dispatch inputs before checkout
        shell: bash
        run: |
          [[ "$PAGES_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PAGES_BASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ZebraRectifier/checkni-g5-preview
          ref: ${{ needs.publish.outputs.site_commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Queue exact-commit Pages publication (completion is verified in its own run)
        env:
          PAGES_DISPATCH_TOKEN: ${{ github.token }}
        run: node tools/browser-release/publication-guard.mjs --dispatch
