name: OKEY delivery price history
on:
  push:
    branches: [main]
    paths:
      - 'tools/okey-public-catalog/collect-eda.mjs'
      - 'tools/okey-public-catalog/eda-parser.mjs'
      - '.github/workflows/okey-public-data.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
concurrency:
  group: okey-public-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: true
      - name: Install locked collector dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Collect visible address-bound observations
        run: node tools/okey-public-catalog/collect-eda.mjs
      - name: Validate measured history
        run: node --test tests/addressPriceHistory.test.mjs
      - name: Commit changed observations only
        run: |
          set -euo pipefail
          git add src/data/okeyDeliveryHistory.json src/data/okeyDeliveryRefresh.json
          if ! git diff --cached --quiet; then
            git config user.name "CHECKNI Price History"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "DATA: publish verified OKEY delivery history"
            git push origin HEAD:main
          fi
      - name: Package static browser artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html prices.html _site/
          cp -a src _site/src
          touch _site/.nojekyll
          if grep -RIE --exclude='*.map' '(OPENROUTER_API_KEY|service[_-]?role[^a-z]|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' _site; then
            exit 1
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
