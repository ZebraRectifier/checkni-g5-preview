name: Pixel character visual review capture
on:
  push:
    branches: [codex/pixel-character-approved-20261021]
permissions:
  contents: read
jobs:
  render:
    if: github.repository == 'ZebraRectifier/checkni-g5-preview' && github.actor == 'ZebraRectifier'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Remove only the four capture targets so every new frame is written
        run: node -e "const fs=require('node:fs');for(const s of ['home','storefront'])for(const d of ['desktop','mobile'])fs.unlinkSync('test/e2e/reference-v13/linux/pixel-character-'+s+'-'+d+'.png');"
      - name: Render fixed fixtures for visual review, not acceptance
        run: npx playwright test --config=playwright.weekly.config.mjs hori-v13.spec.mjs --grep 'stable stores-first' --update-snapshots --workers=1
      - name: Preserve bounded original PNGs in job log without artifact storage
        run: node -e "const fs=require('node:fs');for(const name of fs.readdirSync('test/e2e/reference-v13/linux').filter(n=>n.startsWith('pixel-character-'))){const s=fs.readFileSync('test/e2e/reference-v13/linux/'+name).toString('base64');if(s.length>2000000)throw Error('Image cap');const total=Math.ceil(s.length/12000);for(let i=0;i<total;i++)console.log('CHECKNI_SNAPSHOT|'+name+'|'+i+'|'+total+'|'+s.slice(i*12000,(i+1)*12000));}"
