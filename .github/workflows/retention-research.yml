name: Research retention policy
on:
  pull_request:
    paths:
      - 'tools/browser-release/retention-plan.mjs'
      - 'tools/browser-release/retention-plan.test.mjs'
      - '.github/workflows/retention-research.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tools/browser-release/retention-plan.test.mjs
