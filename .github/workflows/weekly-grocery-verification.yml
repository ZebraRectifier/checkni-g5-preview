name: Weekly grocery artifact verification

on:
  pull_request:
    paths: ['src/**', 'index.html', 'prices.html', 'deployment.json', 'release/**', 'tests/**', 'test/**', 'tools/security/**', 'tools/browser-release/**', 'playwright.weekly.config.mjs', '.github/workflows/weekly-grocery-verification.yml', '.github/workflows/live-retail-smoke.yml']
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'prices.html', 'deployment.json', 'release/**', 'tests/**', 'test/**', 'tools/security/**', 'tools/browser-release/**', 'playwright.weekly.config.mjs', '.github/workflows/weekly-grocery-verification.yml', '.github/workflows/live-retail-smoke.yml']

permissions:
  contents: read

concurrency:
  group: weekly-grocery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard hosted runners are free for this public artifact repository.
    # Never attach this public/fork workflow to the private Cloud.ru runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify isolated active-runtime test preparation
        run: node --test tests/activeRuntimeSandbox.test.mjs tests/immutableReleaseManifest.test.mjs
      - name: Prepare exact active runtime with its verified tests
        id: prepare
        run: node tools/browser-release/prepare-ci-runtime.mjs --ci-only
      - name: Verify grocery contracts and retained OKEY data
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: node --test tests/weeklyBasketFlow.test.mjs tests/magnitCurrentCatalog.test.mjs tests/pyaterochkaPublishedPromotions.test.mjs tests/pyaterochkaShopping.test.mjs tests/nearbyShopping.test.mjs tests/magnitAddressJoin.test.mjs tests/storeGeolocation.test.mjs tests/guidedShoppingFlow.test.mjs tests/guidedBasketComparison.test.mjs tests/manualCatalogComparison.test.mjs tests/sourceScopedRetailList.test.mjs tests/magnitReviewedEggComparison.test.mjs tests/catalogDraftPriceAdmission.test.mjs tests/savedGuidedComparison.test.mjs tests/weeklyRetailBasket.test.mjs tests/weeklyGroceryCompletion.test.mjs tests/weeklyShoppingJourney.test.mjs tests/shoppingDialogueRecovery.test.mjs tests/shoppingSuitabilityQuestion.test.mjs tests/addressPriceHistory.test.mjs tests/okeyRefreshVerification.test.mjs tests/okeyOfficialPromotions.test.mjs tests/okeyPublishedPromotions.test.mjs tests/horiCubePhysics.test.mjs tests/horiCubes.test.mjs tests/pixelCategoryPresentation.test.mjs
      - name: Verify shopping need persistence and identity integrity
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: node --test tests/shoppingNeeds.test.mjs tests/shoppingNeedsRefusalRouting.test.mjs tests/shoppingConversation.test.mjs tests/shoppingIntentIntegrity.test.mjs tests/retailProductSelection.test.mjs tests/shoppingNeedContext.test.mjs tests/householdContextReload.test.mjs tests/adviceContinuationIntake.test.mjs
      - name: Verify common promotions and supported regional searches
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: node --test tests/publishedPromotionCatalog.test.mjs tests/nearbyRegions.test.mjs
      - name: Verify saved METRO lifetime and dynamic DA catalogue policy without network
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: node --test tests/retailCatalogFreshnessPolicy.test.mjs tests/selectedRetailCatalogOffersPort.test.mjs tests/observedComparisonExpiry.test.mjs tests/currentComparisonExplanation.test.mjs tests/comparisonResult.test.mjs tests/retailCatalogPort.test.mjs tests/globusStoreLatestObservationPort.test.mjs
      - name: Scan complete browser artifact and release metadata
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: node tools/security/scan-public-secrets.mjs src index.html prices.html deployment.json release
      - name: Install pinned browser test dependencies
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: npx playwright install --with-deps chromium
      - name: Verify the Pixel Character screenshots on both widths
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: npx playwright test --config=playwright.weekly.config.mjs hori-v13.spec.mjs --grep 'approved PixelCharacter'
      - name: Replay desktop and mobile grocery journeys without external services
        working-directory: ${{ steps.prepare.outputs.workspace }}
        run: npx playwright test --config=playwright.weekly.config.mjs
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-grocery-failure-${{ github.run_id }}
          path: |
            ${{ steps.prepare.outputs.workspace || github.workspace }}/playwright-report/
            ${{ steps.prepare.outputs.workspace || github.workspace }}/test-results/
            ${{ steps.prepare.outputs.workspace || github.workspace }}/ci-runtime-evidence.json
          if-no-files-found: ignore
          retention-days: 7
