name: METRO live address smoke

on:
  push:
    branches: [main]
    paths:
      - "src/app.mjs"
      - "src/components/MetroStorePicker.mjs"
      - "src/data/metroMoscowRegionStores.mjs"
      - "src/ports/retailCatalogPort.mjs"
      - ".github/workflows/metro-live-address-smoke.yml"
  pull_request:
    paths:
      - "src/data/metroMoscowRegionStores.mjs"
      - ".github/workflows/metro-live-address-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metro-live-address-smoke
  cancel-in-progress: true

jobs:
  binding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact public pickup bindings
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {METRO_MOSCOW_REGION_STORES as stores} from "./src/data/metroMoscowRegionStores.mjs";
          assert.equal(stores.length,22);
          assert.equal(stores.filter(s=>s.scope==="moscow-city").length,12);
          assert.equal(stores.filter(s=>s.scope==="moscow-oblast").length,10);
          assert.equal(new Set(stores.map(s=>s.storeNumber)).size,22);
          assert.equal(new Set(stores.map(s=>s.bindingId)).size,22);
          assert.ok(stores.every(s=>s.onlinePickupStatus==="proven" && /^metro-address-[a-z0-9]+$/u.test(s.bindingId)));
          for(const [number,id,scope] of [["49","metro-address-10o1hl3","moscow-city"],["1307","metro-address-7v4tds","moscow-oblast"]]) {
            const store=stores.find(s=>s.storeNumber===number);
            assert.equal(store.bindingId,id);assert.equal(store.scope,scope);
            assert.equal(store.onlinePickupEvidence.storeNumber,number);
            assert.ok(store.onlinePickupEvidence.officialEmail.includes("store"+number+"@metro-cc.ru"));
            assert.ok(store.onlinePickupEvidence.selectedHeader.includes(store.onlinePickupLabel));
            assert.equal(new URL(store.onlinePickupEvidence.sourceUrl).hostname,"metro-cc.ru");
          }
          console.log("METRO_BINDINGS_OK",JSON.stringify({stores:stores.length,head:process.env.GITHUB_SHA}));
          NODE
  metro-live:
    if: github.event_name != 'pull_request'
    needs: binding-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.63.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"

      - name: Verify published METRO address UX
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require("playwright-core");

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ["--no-sandbox"]
            });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));

            const base =
              "https://zebrarectifier.github.io/checkni-g5-preview/?comparison=observed&catalog=retail";

            let ready = false;
            for (let attempt = 0; attempt < 20; attempt += 1) {
              await page.goto(base + "&metroAddressUx=d74e7c97&attempt=" + attempt, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await page.waitForTimeout(1200);
              const text = await page.locator("#retail-store-card-metro").innerText().catch(() => "");
              if (text.includes("METRO · Москва, Ленинградское ш. 71Г")
                  && /\d+ категор/u.test(text)
                  && /\d+ товар/u.test(text)) {
                ready = true;
                break;
              }
              await page.waitForTimeout(1800);
            }
            assert(ready, "Published Pages artifact does not expose current METRO store card");

            const store = page.locator("#retail-store-card-metro");
            await store.click();
            const picker = page.locator("#metro-store-picker");
            await picker.waitFor({ state: "visible", timeout: 15000 });

            const options = picker.locator("#metro-store-address option");
            assert(await options.count() === 22, "METRO picker must expose 22 official directory addresses");
            assert(!await picker.locator('option[value="49"]').isDisabled(), "METRO #49 official pickup binding must be available");
            assert(!await picker.locator('option[value="1307"]').isDisabled(), "METRO #1307 official pickup binding must be available");

            const select = picker.locator("#metro-store-address");
            const expected = [{"storeNumber":"1317","bindingId":"metro-address-17mcpb2","address":"142204, Московская область, г. Серпухов, городской округ Серпухов, бульвар 65 лет Победы, д.4","categoryId":930542483,"sku":"215144","observedAt":"2026-10-10T04:49:02.897Z"},{"storeNumber":"49","bindingId":"metro-address-10o1hl3","address":"108811, г. Москва, внутригородская территория муниципальный округ Ново-Переделкино, квартал 2, д.3, с.1","categoryId":930542483,"sku":"375122","observedAt":"2026-10-10T06:34:50.123Z"},{"storeNumber":"1307","bindingId":"metro-address-7v4tds","address":"142434, Московская Область, Богородский городской округ, деревня Новые Псарьки, ул Парковая, дом 4","categoryId":930542483,"sku":"135490","observedAt":"2026-10-10T06:39:46.743Z"}];
            for (const item of expected) {
              await select.selectOption(item.storeNumber);
              await page.waitForFunction((item) => (
                document.querySelector("#metro-store-address")?.value === item.storeNumber
                && document.querySelector("#retail-store-card-metro")?.textContent?.includes(item.address)
                && document.querySelectorAll("#retail-category-grid .retail-category-button:not(.is-loading)").length > 0
              ), item, { timeout: 15000 });
              const category = page.locator('#retail-category-grid [data-category-id="' + item.categoryId + '"]');
              await category.waitFor({state:"visible",timeout:15000});
              await category.click();
              const card = page.locator('[data-product-id="retail:metro:' + item.bindingId + ':' + item.sku + '"]');
              await card.waitFor({state:"visible",timeout:15000});
              const cardText=await card.innerText();
              assert(/\d[\d\s]*,\d{2} ₽/u.test(cardText),"Current exact-store RUB price missing: "+item.storeNumber);
              assert(cardText.includes("Обычная онлайн-цена"),"METRO price condition missing");
              assert(cardText.includes("источник"),"METRO official source missing");
              assert(await card.getByRole("button").isDisabled(),"METRO observation must remain display-only");
              const ids=await page.locator("#product-grid .product-card").evaluateAll(nodes=>nodes.map(n=>n.getAttribute("data-product-id")));
              assert(ids.length>0 && ids.every(id=>id?.startsWith("retail:metro:"+item.bindingId+":")),"Foreign address rows leaked into "+item.storeNumber);
              console.log("METRO_LIVE_ADDRESS_OK",JSON.stringify({storeNumber:item.storeNumber,bindingId:item.bindingId,sku:item.sku,observedAt:item.observedAt,cardText}));
              await store.click();
            }
            assert(pageErrors.length===0,"Published page errors: "+pageErrors.join(" | "));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
