name: Basket activation migration proof
on:
  pull_request:
    paths:
      - 'tools/browser-release/hosted-basket-migration-fixture.txt'
      - '.github/workflows/basket-migration-proof.yml'
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: proof
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 71a144a1ff43522844b40f3f76526f3e1c43e730
          persist-credentials: false
          path: site
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - working-directory: site
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          cat ../proof/tools/browser-release/hosted-basket-migration-fixture.txt >> test/e2e/guided-shopping.spec.mjs
          npx playwright test --config playwright.weekly.config.mjs --workers=1 test/e2e/guided-shopping.spec.mjs --grep 'same-origin basket survives'
