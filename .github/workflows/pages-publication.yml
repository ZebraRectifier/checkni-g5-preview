name: Publish verified Pages tree

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/pages-publication.yml', '.github/workflows/okey-public-data.yml', '.github/workflows/pyaterochka-public-data.yml', 'tools/browser-release/publication-guard.mjs', 'tools/browser-release/one-shot-*.mjs', 'tools/browser-release/one-shot-inventory.json', 'tests/dataPublication.test.mjs']
  workflow_dispatch:
    inputs:
      site_commit:
        description: Exact current main commit; empty for a manual current-main publication
        required: false
        default: ''
        type: string
      base_commit:
        description: Reviewed parent for a data-only feed commit
        required: false
        default: ''
        type: string
      feed:
        description: Data-only feed identifier (okey or pyaterochka)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site_commit: ${{ steps.scope.outputs.commit }}
    env:
      PAGES_COMMIT: ${{ inputs.site_commit || github.event.pull_request.head.sha || github.sha }}
      PAGES_BASE_COMMIT: ${{ inputs.base_commit }}
      PAGES_FEED: ${{ inputs.feed }}
    steps:
      - name: Reject non-SHA publication inputs before checkout
        shell: bash
        run: |
          [[ "$PAGES_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ZebraRectifier/checkni-g5-preview
          ref: ${{ inputs.site_commit || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify publication guard regressions
        run: node --test tests/dataPublication.test.mjs
      - name: Verify the exact checkout and data-only boundary
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          node tools/browser-release/publication-guard.mjs --checkout
          echo "commit=$PAGES_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Require the exact event SHA and current main before packaging
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node tools/browser-release/publication-guard.mjs --deployment
      - name: Guard reviewed one-shot live and open PR snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/browser-release/one-shot-guard.mjs
      - name: Package reviewed one-shot compact tree
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_SOURCE_SHA="$(git rev-parse HEAD)"
          export PROOF_OUTPUT_ROOT="$PWD/_site"
          export PROOF_RELEASE_IDS="$(node -e "console.log(require('./tools/browser-release/one-shot-inventory.json').releases.join(','))")"
          node tools/browser-release/one-shot-compact.mjs
      - name: Check every packaged immutable release
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import {readdir} from 'node:fs/promises';
          import {verifyLocal,activationState} from './tools/browser-release/verify.mjs';
          const ids=await readdir('_site/releases');
          for(const id of ids) await verifyLocal('_site',id);
          if (!await activationState('_site')) throw Error('active_release_required');
          console.log('Verified packaged releases:',ids.length);
          NODE
      - name: Scan the complete packaged browser tree
        run: node tools/security/scan-public-secrets.mjs _site
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ZebraRectifier/checkni-g5-preview
          ref: ${{ needs.build.outputs.site_commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Recheck the event SHA and main after the deployment queue
        env:
          PAGES_COMMIT: ${{ needs.build.outputs.site_commit }}
          PAGES_BASE_COMMIT: ${{ inputs.base_commit }}
          PAGES_FEED: ${{ inputs.feed }}
        run: node tools/browser-release/publication-guard.mjs --deployment
      - name: Recheck reviewed live and open PR snapshot after queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/browser-release/one-shot-guard.mjs
      - name: Publish verified tree
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
