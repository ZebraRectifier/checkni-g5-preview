name: Publish verified Pages tree

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/pages-publication.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Package tracked website files without build and test tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          git archive --format=tar HEAD -- .nojekyll index.html prices.html deployment.json src releases release artifacts | tar -xf - -C _site
          test -f _site/index.html
          test -f _site/prices.html
      - name: Check every packaged immutable release
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import {readdir} from 'node:fs/promises';
          import {verifyLocal} from './tools/browser-release/verify.mjs';
          const ids=await readdir('_site/releases');
          for(const id of ids) await verifyLocal('_site',id);
          console.log('Verified packaged releases:',ids.length);
          NODE
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified tree
        id: deployment
        uses: actions/deploy-pages@v5
