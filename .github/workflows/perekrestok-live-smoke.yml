name: Perekrestok Live Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/live-retail-smoke-contract.mjs"
      - "tests/live-retail-smoke-contract.test.mjs"
      - "src/ports/retailCatalogPort.mjs"
      - "deployment.json"
      - ".github/workflows/perekrestok-live-smoke.yml"
      - ".github/workflows/live-retail-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/perekrestok-live-smoke.yml"
      - "tools/live-retail-smoke-contract.mjs"
      - "tests/live-retail-smoke-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node --test tests/live-retail-smoke-contract.test.mjs
  perekrestok-live:
    if: github.event_name != 'pull_request'
    needs: smoke-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.63.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"

      - name: Verify published mass Perekrestok catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require("playwright-core");
          const base =
            "https://zebrarectifier.github.io/checkni-g5-preview/?comparison=observed&catalog=retail";

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function storeFacts(card) {
            const name = await card.locator("strong").innerText();
            const scope = (await card.locator(".retail-store-copy > span").last().textContent()).trim();
            const tooltip = await card.getAttribute("title");
            const label = await card.getAttribute("aria-label");
            assert(name && tooltip === scope && label === name + ": " + scope,
              "Store card must expose its chain and complete source scope");
            return name + " · " + scope + "\n" + await card.locator(".retail-store-total").textContent();
          }

          async function allCategories(page, expectedCount) {
            await page.waitForFunction(count => (
              document.querySelector('#retail-store-card-perekrestok')?.getAttribute('aria-pressed') === 'true'
              && document.querySelector('#retail-category-status')?.textContent.trim() === 'Разделов: ' + count
              && document.querySelectorAll(
              "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
            ).length > 0), expectedCount, {timeout:15000});
            const all = page.locator("#retail-category-grid .pixel-all-categories");
            if (expectedCount > 7) {
              await all.waitFor({state:'visible',timeout:15000});
              await all.click();
            }
          }
          async function chooseStore(page, selector) {
            if (!await page.locator("#pixel-store-home").isVisible())
              await page.locator('[data-pixel-action="stores"]').click();
            await page.locator(selector).click();
            await page.locator("#pixel-storefront").waitFor({state:"visible"});
          }
          async function details(page, open) {
            const node = page.locator("#pixel-store-details");
            if (await node.evaluate(e => e.open) !== open) await node.locator(":scope > summary").click();
          }
          async function priceDetails(card) {
            const disclosure = card.locator("details").first();
            if (await disclosure.count() && !await disclosure.evaluate(e => e.open))
              await disclosure.locator(":scope > summary").click();
          }

          (async () => {
            const { pinnedLiveRuntimeProof } = await import("./tools/live-retail-smoke-contract.mjs");
            const runtime = await pinnedLiveRuntimeProof({
              baseUrl: "https://zebrarectifier.github.io/checkni-g5-preview/",
              files: ["src/app.mjs", "src/components/ProductCard.mjs", "src/ports/retailCatalogPort.mjs", "src/catalog/reviewedRetailBasket.mjs", "src/catalog/perekrestokReviewedList.mjs", "src/catalog/sourceScopedRetailList.mjs", "src/catalog/sourceCatalogListAdmission.mjs", "src/data/metroMoscowRegionStores.mjs"]
            });
            const runtimePrefix = "./" + runtime.prefix;
            const {createRetailCatalogClient,normalizeRetailCategory} = await import(runtimePrefix + "src/ports/retailCatalogPort.mjs");
            const definition = createRetailCatalogClient({retailerId:"perekrestok"}).definition;
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ["--no-sandbox"]
            });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));

            let published = false;
            for (let attempt = 0; attempt < 20; attempt += 1) {
              await page.goto(base + "&perekrestokMass=16298513&attempt=" + attempt, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await page.waitForTimeout(1500);
              const text = await storeFacts(page.locator("#retail-store-card-perekrestok"))
                .catch(() => "");
              if (
                text.includes("Перекрёсток · Москва · цены доставки Яндекс Еды")
                && text.includes("Каталог выбранного адреса")
                && text.includes("наличие неизвестно")
                && await runtime.matchesPublished(attempt)
              ) {
                published = true;
                break;
              }
              await page.waitForTimeout(2500);
            }
            assert(published, "Published Pages artifact does not expose mass Perekrestok");
            assert(await page.locator('script[type="module"][src$="/src/app.mjs"]').getAttribute("src")
              === runtimePrefix + "src/app.mjs", "Browser Perekrestok runtime differs from byte-verified release");

            const store = page.locator("#retail-store-card-perekrestok");
            const rootResponse = page.waitForResponse(response => {
              const url = new URL(response.url());
              return url.pathname.endsWith("/rest/v1/retail_catalog_categories")
                && url.searchParams.get("retailer_id") === "eq.perekrestok"
                && url.searchParams.get("depth") === "eq.0" && response.status() === 200;
            }, {timeout:15000});
            await chooseStore(page, "#retail-store-card-perekrestok");
            const sourceRows = await (await rootResponse).json();
            assert(Array.isArray(sourceRows) && sourceRows.length > 0, "Source roots missing");
            const expectedIds = sourceRows.map(row => normalizeRetailCategory(row, definition)).filter(Boolean)
              .map(category => String(category.categoryId)).sort();
            assert(expectedIds.length > 0, "No source roots passed admission");
            console.log("PEREKRESTOK_ADMITTED_ROOTS", JSON.stringify({sourceRows:sourceRows.length,admitted:expectedIds.length}));
            await allCategories(page, expectedIds.length);
            console.log("PEREKRESTOK_RENDERED_ROOTS", JSON.stringify(await page.evaluate(() => ({
              selected: document.querySelector('#retail-store-card-perekrestok')?.getAttribute('aria-pressed'),
              ids: Array.from(document.querySelectorAll('#retail-category-grid [data-category-id]'),node=>node.dataset.categoryId),
              status: document.querySelector('#retail-category-status')?.textContent
            }))));
            await page.waitForFunction(expected => (
              document.querySelector("#retail-store-card-perekrestok")
                ?.getAttribute("aria-pressed") === "true"
              && JSON.stringify(Array.from(document.querySelectorAll(
                "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
              ),node=>node.dataset.categoryId).sort()) === JSON.stringify(expected)
            ), expectedIds, { timeout: 15000 });

            const roots = page.locator(
              "#retail-category-grid .retail-category-button[data-category-id]:not(.is-loading)"
            );
            assert(await roots.count() === expectedIds.length, "Perekrestok root must expose every currently admitted source category");

            const rootTexts = await roots.allTextContents();
            let index = rootTexts.findIndex((text) => {
              const match = text.match(/([\d\s]+) товаров/u);
              return match && Number(match[1].replace(/\s+/gu, "")) > 0;
            });
            assert(index >= 0, "No Perekrestok root category exposes products");
            await roots.nth(index).click();

            await page.waitForFunction(() => (
              document.querySelectorAll(
                '#product-grid .product-card[data-product-id^="retail:perekrestok:perekrestok-yandex-3186917:"]'
              ).length > 0
            ), null, { timeout: 15000 });

            const card = page.locator(
              '#product-grid .product-card[data-product-id^="retail:perekrestok:perekrestok-yandex-3186917:"]'
            ).first();
            await priceDetails(card);
            const cardText = await card.innerText();

            assert(/\d[\d\s]*,\d{2} ₽/u.test(cardText), "Perekrestok card has no observed RUB price");
            assert(
              /(?:Цена доставки Яндекс Еды|Промо-цена доставки Яндекс Еды)/u.test(cardText),
              "Perekrestok price condition is missing"
            );
            assert(
              cardText.includes("Перекрёсток · Москва, Большой Овчинниковский пер. 16 · Яндекс Еда · источник"),
              "Perekrestok store/source provenance is missing"
            );
            // Use the actual immutable manual-list contract. A source SKU is
            // not a canonical equivalent and does not establish a cheaper store.
            const { getReviewedRetailBasketProduct } = await import(runtimePrefix + "src/catalog/reviewedRetailBasket.mjs");
            const { sourceCatalogListSelection, SOURCE_CATALOG_LIST_MAX_AGE_MS } = await import(runtimePrefix + "src/catalog/sourceCatalogListAdmission.mjs");
            const prefix = "retail:perekrestok:perekrestok-yandex-3186917:";
            const cardId = await card.getAttribute("data-product-id");
            assert(cardId?.startsWith(prefix), "Unexpected delivery context");
            const sourceId = cardId.slice(prefix.length);
            const lookup = await createRetailCatalogClient({ retailerId:"perekrestok" }).bySourceProductIds([sourceId]);
            const item = lookup.kind === "catalog" ? lookup.products.find(row => row.id === cardId) : null;
            assert(item, "Exact saved catalogue card unavailable for manual-list verification");
            const identity = getReviewedRetailBasketProduct(item);
            const allowed = Boolean(identity && item.basketProductId === identity.id);
            const add = card.locator(".add-button");
            assert(await add.isDisabled() === !allowed,
              "Delivery add action must follow pinned identity/scope/freshness admission");
            assert(await card.locator(".product-observed-at").getAttribute("datetime") === item.observedAt,
              "Delivery card observation date differs from the exact source row");
            if (item.sourceListOnly) {
              assert(allowed && identity.id === cardId, "Source-scoped list item lost its original store/SKU identity");
              assert(sourceCatalogListSelection(item, { nowMs: Date.parse(item.observedAt) + SOURCE_CATALOG_LIST_MAX_AGE_MS }) === null,
                "Expired source observation must not grant manual-list admission");
              assert(sourceCatalogListSelection(JSON.parse(JSON.stringify(item))) === null,
                "Saved JSON must not recreate source admission or a comparison offer");
            }
            if (allowed) {
              await add.click();
              await page.waitForFunction(id => JSON.parse(localStorage.getItem("checkni.surface.basket.v1") ?? "[]")
                .some(row => row.id === id && row.quantity === 1), identity.id, { timeout: 5000 });
              const saved = await page.evaluate(() => JSON.parse(localStorage.getItem("checkni.surface.basket.v1") ?? "[]"));
              assert(saved.length === 1 && saved[0].id === identity.id && saved[0].name === identity.name,
                "Manual list must keep the exact admitted item");
              assert(Object.keys(saved[0]).sort().join(",") === "id,name,quantity,unit",
                "Manual list must not persist an observation price as a comparison offer");
              await page.locator('[data-pixel-action="basket"]').click();
              await page.locator(".basket-row").filter({ hasText: identity.name }).waitFor({ state: "visible" });
              await page.reload({ waitUntil: "domcontentloaded" });
              await page.locator(".basket-row").filter({ hasText: identity.name }).waitFor({ state: "visible", timeout: 15000 });
              assert(await page.evaluate(id => JSON.parse(localStorage.getItem("checkni.surface.basket.v1") ?? "[]")
                .some(row => row.id === id && row.quantity === 1), identity.id), "Reload lost the source-scoped manual list");
            }
            assert(pageErrors.length === 0, "Page errors: " + pageErrors.join(" | "));

            console.log("PEREKRESTOK_MASS_LIVE", JSON.stringify({
              store: await storeFacts(store),
              categoryCount: expectedIds.length,
              product: cardText
            }));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
