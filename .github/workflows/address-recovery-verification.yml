name: Address recovery contracts
on:
  pull_request:
    paths: ['src/ports/addressRecovery.mjs', 'src/ports/nearbyShoppingPort.mjs', 'tests/addressRecovery.test.mjs', '.github/workflows/address-recovery-verification.yml']
  push:
    branches: [main]
    paths: ['src/ports/addressRecovery.mjs', 'src/ports/nearbyShoppingPort.mjs', 'tests/addressRecovery.test.mjs', '.github/workflows/address-recovery-verification.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/addressRecovery.test.mjs
