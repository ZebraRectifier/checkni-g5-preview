name: Cross-retailer weekly basket
on:
  pull_request:
    paths: ['src/**','tests/**','test/**','playwright.cross-retailer.config.mjs','.github/workflows/weekly-cross-retailer.yml']
  push:
    branches: [main]
    paths: ['src/**','tests/**','test/**','playwright.cross-retailer.config.mjs','.github/workflows/weekly-cross-retailer.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/weeklyCrossRetailer.test.mjs tests/catalogQuantityIntent.test.mjs tests/guidedRetailerContext.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.cross-retailer.config.mjs
